name: acceptance-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Unit + integration smoke (FastAPI TestClient, no uvicorn needed)
      - name: make test
        run: make test

      # Customer acceptance criteria — NOT ML metrics
      # Tests: pediatric safety floor · chest-pain ESI · well-visit not-uptriaged
      #        · p95 latency budget · response schema completeness
      - name: make acceptance
        run: make acceptance

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-log
          path: outputs/
          retention-days: 30
